<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Trade - Trade Tracker</title>
    <link rel="stylesheet" href="../styles/style.css" />
    <link rel="stylesheet" href="../styles/add-trade.css" />
    <script src="../scripts/include.js" defer></script>
    <script src="../scripts/add-trades.js" defer></script>
    <script>
        // Set today's date as default
        document.addEventListener("DOMContentLoaded", () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById("tradeDate").value = today;
        });
    </script>
</head>

<body>

    <!-- NAVBAR -->
    <div data-include="partials/navbar.html"></div>

    <!-- ADD TRADE FORM SECTION -->
    <section class="form-section">
        <h2>Add New Trade</h2>
        <form action="/trades" method="POST" class="trade-form" enctype="multipart/form-data">
            <div class="form-group">
                <label for="tradeDate">Date of Trade <span class="text-red">*</span></label>
                <input type="date" id="tradeDate" name="tradeDate" />
            </div>

            <div class="form-group">
                <label for="instrument">Instrument Name <span class="text-red">*</span></label>
                <input type="hidden" id="instrument" name="instrument">
                <div class="selection-group" data-input-id="instrument">
                    <button type="button" class="option-btn" data-value="Gold">Gold</button>
                    <button type="button" class="option-btn" data-value="CrudeOil">Crude Oil</button>
                    <button type="button" class="option-btn" data-value="BTC">BTC</button>
                    <button type="button" class="option-btn" data-value="ETH">ETH</button>
                    <button type="button" class="option-btn" data-value="USD/CAD">USD/CAD</button>
                    <button type="button" class="option-btn" data-value="USD/JPY">USD/JPY</button>
                    <button type="button" class="option-btn" data-value="USD/CHF">USD/CHF</button>
                    <button type="button" class="option-btn" data-value="EUR/USD">EUR/USD</button>
                    <button type="button" class="option-btn" data-value="AUD/USD">AUD/USD</button>
                    <button type="button" class="option-btn" data-value="GBP/USD">GBP/USD</button>
                    <button type="button" class="option-btn" data-value="EUR/JPY">EUR/JPY</button>
                    <button type="button" class="option-btn" data-value="NAS100">NAS100</button>
                    <button type="button" class="option-btn" data-value="Other" data-toggle="other">Other</button>
                </div>
                <input type="text" id="otherInstrument" name="otherInstrument" placeholder="Enter instrument name"
                     class="other-input" />
            </div>

            <div class="form-group">
                <label for="tradeType">Trade Type <span class="text-red">*</span></label>
                <input type="hidden" id="tradeType" name="tradeType">
                <div class="selection-group" data-input-id="tradeType">
                    <button type="button" class="option-btn" data-value="BUY">Buy</button>
                    <button type="button" class="option-btn" data-value="SELL">Sell</button>
                </div>
            </div>

            <div class="form-group">
                <label for="quantity">Quantity <span class="text-red">*</span></label>
                <input type="hidden" id="quantity" name="quantity">
                <div class="selection-group" data-input-id="quantity">
                    <button type="button" class="option-btn" data-value="0.1">0.1</button>
                    <button type="button" class="option-btn" data-value="0.15">0.15</button>
                    <button type="button" class="option-btn" data-value="0.2">0.2</button>
                    <button type="button" class="option-btn" data-value="0.25">0.25</button>
                    <button type="button" class="option-btn" data-value="0.5">0.5</button>
                    <button type="button" class="option-btn" data-value="1">1</button>
                    <button type="button" class="option-btn" data-value="2">2</button>
                    <button type="button" class="option-btn" data-value="5">5</button>
                    <button type="button" class="option-btn" data-value="10">10</button>
                    <button type="button" class="option-btn" data-value="Other" data-toggle="other">Other</button>
                </div>
                <input type="number" step="0.01" id="otherQuantity" name="otherQuantity" placeholder="Enter quantity"
                     class="other-input" />
            </div>

            <div class="form-group">
                <label for="risk">Risk <span class="text-red">*</span></label>
                <input type="hidden" id="risk" name="risk">
                <div class="selection-group" data-input-id="risk">
                    <button type="button" class="option-btn" data-value="50">50</button>
                    <button type="button" class="option-btn" data-value="100">100</button>
                    <button type="button" class="option-btn" data-value="150">150</button>
                    <button type="button" class="option-btn" data-value="200">200</button>
                    <button type="button" class="option-btn" data-value="250">250</button>
                    <button type="button" class="option-btn" data-value="300">300</button>
                    <button type="button" class="option-btn" data-value="400">400</button>
                    <button type="button" class="option-btn" data-value="500">500</button>
                    <button type="button" class="option-btn" data-value="1000">1000</button>
                    <button type="button" class="option-btn" data-value="Other" data-toggle="other">Other</button>
                </div>
                <input type="number" step="0.01" id="otherRisk" name="otherRisk" placeholder="Enter risk" 
                    class="other-input" />
            </div>

            <div class="form-group">
                <label for="reward">Reward </label>
                <input type="hidden" id="reward" name="reward">
                <div class="selection-group" data-input-id="reward">
                    <button type="button" class="option-btn" data-value="50">50</button>
                    <button type="button" class="option-btn" data-value="100">100</button>
                    <button type="button" class="option-btn" data-value="150">150</button>
                    <button type="button" class="option-btn" data-value="200">200</button>
                    <button type="button" class="option-btn" data-value="250">250</button>
                    <button type="button" class="option-btn" data-value="300">300</button>
                    <button type="button" class="option-btn" data-value="400">400</button>
                    <button type="button" class="option-btn" data-value="500">500</button>
                    <button type="button" class="option-btn" data-value="1000">1000</button>
                    <button type="button" class="option-btn" data-value="Other" data-toggle="other">Other</button>
                </div>
                <input type="number" step="0.01" id="otherReward" name="otherReward" placeholder="Enter reward"
                    class="other-input" />
            </div>

            <div class="form-group">
                <label for="strategy">Strategy Used</label>
                <input type="hidden" id="strategy" name="strategy">
                <div class="selection-group" data-input-id="strategy">
                    <button type="button" class="option-btn" data-value="Price Action">Price Action</button>
                    <button type="button" class="option-btn" data-value="200EMA">200EMA</button>
                    <button type="button" class="option-btn" data-value="Reversal">Reversal</button>
                    <button type="button" class="option-btn" data-value="Breakout">Breakout</button>
                    <button type="button" class="option-btn" data-value="Pullback">Pullback</button>
                    <button type="button" class="option-btn" data-value="Other" data-toggle="other">Other</button>
                </div>
                <input type="text" id="otherStrategy" name="otherStrategy" placeholder="Enter strategy"
                    class="other-input" />
            </div>


            <div class="form-group">
                <label for="entryReason">Entry Reason</label>
                <textarea id="entryReason" name="entryReason" rows="3"
                    placeholder="Why did you enter this trade?"></textarea>
            </div>

            <div class="form-group">
                <label for="exitReason">Exit Reason</label>
                <textarea id="exitReason" name="exitReason" rows="3"
                    placeholder="Why did you exit this trade?"></textarea>
            </div>

            <div class="form-group">
                <label for="pnl">Profit/Loss <span class="text-red">*</span></label>
                <input type="number" id="pnl" name="pnl" step="0.01" />
            </div>

            <div class="form-group">
                <label for="emotion">Emotional Status <span class="text-red">*</span></label>
                <input type="hidden" id="emotion" name="emotion">
                <div class="selection-group" data-input-id="emotion">
                    <button type="button" class="option-btn" data-value="Calm">Calm</button>
                    <button type="button" class="option-btn" data-value="Anxious">Anxious</button>
                    <button type="button" class="option-btn" data-value="Confident">Confident</button>
                    <button type="button" class="option-btn" data-value="Frustrated">Frustrated</button>
                    <button type="button" class="option-btn" data-value="Excited">Excited</button>
                    <button type="button" class="option-btn" data-value="Fearful">Fearful</button>
                    <button type="button" class="option-btn" data-value="Greedy">Greedy</button>
                </div>
            </div>

            <div class="form-group">
                <label for="mistakes">Mistakes Made</label>
                <textarea id="mistakes" name="mistakes" rows="3"
                    placeholder="What could you have done better?"></textarea>
            </div>

            <div class="form-group">
                <label>Discipline Checklist (YES / NO) <span class="text-red">*</span></label>

                <div class="discipline-item">
                    <span>1) Entered on Setup:</span>
                    <div class="discipline-options">
                        <label><input type="radio" name="entrySetup" value="1"> Yes</label>
                        <label><input type="radio" name="entrySetup" value="-1"> No</label>
                    </div>
                </div>

                <div class="discipline-item">
                    <span>2) Fixed Stop Loss:</span>
                    <div class="discipline-options">
                        <label><input type="radio" name="exitDiscipline" value="1"> Yes</label>
                        <label><input type="radio" name="exitDiscipline" value="-1"> No</label>
                    </div>
                </div>

                <div class="discipline-item">
                    <span>3) Calculated Quantity:</span>
                    <div class="discipline-options">
                        <label><input type="radio" name="correctQuantity" value="1"> Yes</label>
                        <label><input type="radio" name="correctQuantity" value="-1"> No</label>
                    </div>
                </div>

                <div class="discipline-item">
                    <span>4) Calculated Risk:</span>
                    <div class="discipline-options">
                        <label><input type="radio" name="calculatedRisk" value="1"> Yes</label>
                        <label><input type="radio" name="calculatedRisk" value="-1"> No</label>
                    </div>
                </div>

                <div class="discipline-item">
                    <span>5) Emotion Controlled:</span>
                    <div class="discipline-options">
                        <label><input type="radio" name="emotionDiscipline" value="1"> Yes</label>
                        <label><input type="radio" name="emotionDiscipline" value="-1"> No</label>
                    </div>
                </div>
                <br>

                <div class="form-group">
                    <label for="disciplineScoreSlider">Total Discipline Score</label>
                    <div class="discipline-score-container">
                        <input type="range" id="disciplineScoreSlider" min="-5" max="5" step="1" value="0" disabled
                            class="discipline-slider" />
                        <strong><span id="disciplineScoreValue">0</span></strong>
                    </div>
                </div>

            </div>

            <div class="form-group">
                <label for="entryChartScreenshot">Entry Chart Screenshot</label>
                <input type="file" id="entryChartScreenshot" name="entryChartScreenshot" accept="image/*" />
            </div>

            <div class="form-group">
                <label for="exitChartScreenshot">Exit Chart Screenshot</label>
                <input type="file" id="exitChartScreenshot" name="exitChartScreenshot" accept="image/*" />
            </div>

            <div class="form-group">
                <label for="notes">Additional Notes</label>
                <textarea id="notes" name="notes" rows="4" placeholder="Any other observations?"></textarea>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" id="saveDraftButton" style="background-color: #6c757d; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">Save as Draft</button>
                <button type="submit" class="submit-button" id="saveTradeButton">Save Trade</button>
            </div>
        </form>
    </section>

    <!-- FOOTER -->
    <div data-include="partials/footer.html"></div>

</body>

</html>
