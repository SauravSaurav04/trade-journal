<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Draft Trades - Trade Tracker</title>
    <link rel="stylesheet" href="../styles/style.css" />
    <link rel="stylesheet" href="../styles/trade-history.css" />
    <script src="../scripts/include.js" defer></script>
    <script src="../scripts/drafts.js" defer></script>
</head>

<body>
    <div class="page-wrapper">
        <!-- NAVBAR -->
        <div data-include="partials/navbar.html"></div>

        <!-- TRADE HISTORY SECTION -->
        <section class="history-section">
            <h2>Your Draft Trades</h2>

            <div class="table-container">
                <table class="trade-table">
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>Date</th>
                            <th>Instrument</th>
                            <th>Type</th>
                            <th>Quantity</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- FOOTER -->
        <div data-include="partials/footer.html"></div>
    </div>
</body>

</html>
